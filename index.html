<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web 手部捕捉 Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        color: #d1d5db;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }

      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      video {
        transform: scaleX(-1);
      }

      canvas {
        pointer-events: auto;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #93c5fd;
      }

      .gesture-state {
        margin-top: 8px;
        font-size: 15px;
        color: #facc15;
      }

      .controls {
        display: flex;
        gap: 16px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .controls label {
        font-size: 13px;
        color: #d1d5db;
      }

      .controls input {
        vertical-align: middle;
      }

      .live-params {
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.7);
        color: #cbd5e1;
        font-size: 14px;
      }

      .metric {
        color: #fca5a5;
        font-weight: 600;
      }

      .metric.pass {
        color: #4ade80;
      }

      .calibration-panel {
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid #334155;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.7);
        font-size: 14px;
      }

      .calibration-panel button {
        margin-right: 8px;
      }

      .log-list {
        margin: 8px 0 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>前置鏡頭手部捕捉 (HTML Demo)</h1>
      <p>允許攝影機權限後，會在手部關鍵點上畫線與節點。</p>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <label>
          食指伸直門檻
          <input id="extendedThreshold" type="range" min="0" max="0.12" step="0.005" value="0.02" />
          <span id="extendedThresholdValue">0.02</span>
        </label>
        <label>
          其他手指彎曲門檻
          <input id="curledThreshold" type="range" min="0" max="0.12" step="0.005" value="0.02" />
          <span id="curledThresholdValue">0.02</span>
        </label>
      </div>
      <div id="liveParams" class="live-params">
        即時參數：食指伸直值 <span id="liveExtended" class="metric">0.000</span>、其他手指彎曲值
        <span id="liveCurled" class="metric">0.000</span>
      </div>
      <div class="calibration-panel">
        <button id="startCalibBtn" type="button">開始手動A4校正</button>
        <button id="resetCalibBtn" type="button">重設校正</button>
        <div id="calibrationState">A4校正：自動偵測牛皮紙袋中（按鈕置中）</div>
        <div id="pressState">按鈕狀態：idle</div>
        <div id="pressMetrics">距離: -- cm | 深度: -- | hold: -- ms</div>
        <div id="pressStats">成功次數: 0 / 嘗試次數: 0</div>
        <ol id="pressLogs" class="log-list"></ol>
      </div>
      <div id="status" class="status">初始化中...</div>
      <div id="gestureState" class="gesture-state">手勢1：尚未偵測</div>
    </div>

    <script type="module">
      import {
        HandLandmarker,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

      const video = document.getElementById("video");
      const stageEl = document.querySelector(".stage");
      const canvas = document.getElementById("overlay");
      const statusEl = document.getElementById("status");
      const gestureStateEl = document.getElementById("gestureState");
      const extendedThresholdInput = document.getElementById("extendedThreshold");
      const curledThresholdInput = document.getElementById("curledThreshold");
      const extendedThresholdValue = document.getElementById("extendedThresholdValue");
      const curledThresholdValue = document.getElementById("curledThresholdValue");
      const liveParamsEl = document.getElementById("liveParams");
      const liveExtendedEl = document.getElementById("liveExtended");
      const liveCurledEl = document.getElementById("liveCurled");
      const startCalibBtn = document.getElementById("startCalibBtn");
      const resetCalibBtn = document.getElementById("resetCalibBtn");
      const calibrationStateEl = document.getElementById("calibrationState");
      const pressStateEl = document.getElementById("pressState");
      const pressMetricsEl = document.getElementById("pressMetrics");
      const pressStatsEl = document.getElementById("pressStats");
      const pressLogsEl = document.getElementById("pressLogs");
      const ctx = canvas.getContext("2d");

      const params = {
        extendedThreshold: Number(extendedThresholdInput.value),
        curledThreshold: Number(curledThresholdInput.value),
      };
      const GESTURE_ACTIVE_MS = 5000;
      const HAND_COLOR_THEMES = {
        Left: { point: "#22c55e", line: "#4ade80", box: "#16a34a" },
        Right: { point: "#3b82f6", line: "#60a5fa", box: "#2563eb" },
        Unknown: { point: "#94a3b8", line: "#cbd5e1", box: "#64748b" },
      };
      const INDEX_PATH = [0, 5, 6, 7, 8];
      const INDEX_POINTS = [5, 6, 7, 8];
      let lastOneMatchedAt = 0;
      let activeHandIndex = -1;
      const A4_WIDTH_CM = 21.0;
      const A4_HEIGHT_CM = 29.7;
      const wallButton = { cx: 10.5, cy: 14.85, radiusCm: 2.5 };
      const pressConfig = {
        hoverToleranceCm: 1.0,
        pressDepthThreshold: 0.03,
        minHoldMs: 100,
        releaseDepthThreshold: 0.015,
        debounceMs: 250,
      };
      let calibrationPoints = [];
      let calibrating = false;
      let autoDetectBag = true;
      let imageToWallH = null;
      let wallToImageH = null;
      let detectedBagRect = null;
      let detectFrameCount = 0;
      let interactionState = "idle";
      let pressStartAt = 0;
      let hoverBaselineZ = null;
      let lastPressAt = -Infinity;
      let prevInsideButton = false;
      let attempts = 0;
      let successCount = 0;
      let currentMetrics = { distanceCm: null, pressDepth: null, holdMs: 0 };
      const pressLogs = [];
      const detectCanvas = document.createElement("canvas");
      const detectCtx = detectCanvas.getContext("2d", { willReadFrequently: true });

      function setCalibrationState(text) {
        calibrationStateEl.textContent = `A4校正：${text}`;
      }

      function updatePressHud() {
        pressStateEl.textContent = `按鈕狀態：${interactionState}`;
        const distText = currentMetrics.distanceCm == null ? "--" : currentMetrics.distanceCm.toFixed(2);
        const depthText = currentMetrics.pressDepth == null ? "--" : currentMetrics.pressDepth.toFixed(4);
        const holdText = currentMetrics.holdMs == null ? "--" : Math.round(currentMetrics.holdMs);
        pressMetricsEl.textContent = `距離: ${distText} cm | 深度: ${depthText} | hold: ${holdText} ms`;
        pressStatsEl.textContent = `成功次數: ${successCount} / 嘗試次數: ${attempts}`;
      }

      function refreshPressLogs() {
        pressLogsEl.innerHTML = "";
        for (const item of pressLogs) {
          const li = document.createElement("li");
          li.textContent = item;
          pressLogsEl.appendChild(li);
        }
      }

      function pushPressLog(msg) {
        const stamp = new Date().toLocaleTimeString();
        pressLogs.unshift(`${stamp} ${msg}`);
        if (pressLogs.length > 6) {
          pressLogs.pop();
        }
        refreshPressLogs();
      }

      function solveLinearSystem(A, b) {
        const n = A.length;
        const M = A.map((row, i) => [...row, b[i]]);
        for (let col = 0; col < n; col += 1) {
          let pivot = col;
          for (let r = col + 1; r < n; r += 1) {
            if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) {
              pivot = r;
            }
          }
          if (Math.abs(M[pivot][col]) < 1e-9) return null;
          [M[col], M[pivot]] = [M[pivot], M[col]];
          const div = M[col][col];
          for (let c = col; c <= n; c += 1) {
            M[col][c] /= div;
          }
          for (let r = 0; r < n; r += 1) {
            if (r === col) continue;
            const factor = M[r][col];
            for (let c = col; c <= n; c += 1) {
              M[r][c] -= factor * M[col][c];
            }
          }
        }
        return M.map((row) => row[n]);
      }

      function computeHomography(srcPts, dstPts) {
        const A = [];
        const b = [];
        for (let i = 0; i < 4; i += 1) {
          const { x, y } = srcPts[i];
          const { x: u, y: v } = dstPts[i];
          A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]);
          b.push(u);
          A.push([0, 0, 0, x, y, 1, -v * x, -v * y]);
          b.push(v);
        }
        const h = solveLinearSystem(A, b);
        if (!h) return null;
        return [
          [h[0], h[1], h[2]],
          [h[3], h[4], h[5]],
          [h[6], h[7], 1],
        ];
      }

      function invert3x3(m) {
        const a = m[0][0], b = m[0][1], c = m[0][2];
        const d = m[1][0], e = m[1][1], f = m[1][2];
        const g = m[2][0], h = m[2][1], i = m[2][2];
        const A = e * i - f * h;
        const B = -(d * i - f * g);
        const C = d * h - e * g;
        const D = -(b * i - c * h);
        const E = a * i - c * g;
        const F = -(a * h - b * g);
        const G = b * f - c * e;
        const H = -(a * f - c * d);
        const I = a * e - b * d;
        const det = a * A + b * B + c * C;
        if (Math.abs(det) < 1e-9) return null;
        return [
          [A / det, D / det, G / det],
          [B / det, E / det, H / det],
          [C / det, F / det, I / det],
        ];
      }

      function projectPoint(H, x, y) {
        const X = H[0][0] * x + H[0][1] * y + H[0][2];
        const Y = H[1][0] * x + H[1][1] * y + H[1][2];
        const W = H[2][0] * x + H[2][1] * y + H[2][2];
        if (Math.abs(W) < 1e-9) return null;
        return { x: X / W, y: Y / W };
      }

      function detectBrownBagRect() {
        if (!video.videoWidth || !video.videoHeight) return null;
        detectCanvas.width = 160;
        detectCanvas.height = 120;
        detectCtx.drawImage(video, 0, 0, detectCanvas.width, detectCanvas.height);
        const { data, width, height } = detectCtx.getImageData(0, 0, detectCanvas.width, detectCanvas.height);
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        let matched = 0;
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const i = (y * width + x) * 4;
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const isBrown = r > 85 && g > 55 && b < 120 && r > (g + 12) && g > (b + 8);
            if (!isBrown) continue;
            matched += 1;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
        if (matched < 220 || maxX < minX || maxY < minY) return null;
        const boxW = maxX - minX + 1;
        const boxH = maxY - minY + 1;
        const boxArea = boxW * boxH;
        const density = matched / boxArea;
        if (density < 0.12 || boxArea < 900) return null;
        const sx = canvas.width / width;
        const sy = canvas.height / height;
        return {
          minX: minX * sx,
          minY: minY * sy,
          maxX: (maxX + 1) * sx,
          maxY: (maxY + 1) * sy,
        };
      }

      function imageToWallPoint(x, y) {
        if (autoDetectBag && detectedBagRect) {
          const width = detectedBagRect.maxX - detectedBagRect.minX;
          const height = detectedBagRect.maxY - detectedBagRect.minY;
          if (width < 1 || height < 1) return null;
          return {
            x: ((x - detectedBagRect.minX) / width) * A4_WIDTH_CM,
            y: ((y - detectedBagRect.minY) / height) * A4_HEIGHT_CM,
          };
        }
        return imageToWallH ? projectPoint(imageToWallH, x, y) : null;
      }

      function wallToImagePoint(x, y) {
        if (autoDetectBag && detectedBagRect) {
          const width = detectedBagRect.maxX - detectedBagRect.minX;
          const height = detectedBagRect.maxY - detectedBagRect.minY;
          return {
            x: detectedBagRect.minX + (x / A4_WIDTH_CM) * width,
            y: detectedBagRect.minY + (y / A4_HEIGHT_CM) * height,
          };
        }
        return wallToImageH ? projectPoint(wallToImageH, x, y) : null;
      }

      extendedThresholdInput.addEventListener("input", () => {
        params.extendedThreshold = Number(extendedThresholdInput.value);
        extendedThresholdValue.textContent = params.extendedThreshold.toFixed(2);
        updateLiveParams(null);
      });

      curledThresholdInput.addEventListener("input", () => {
        params.curledThreshold = Number(curledThresholdInput.value);
        curledThresholdValue.textContent = params.curledThreshold.toFixed(2);
        updateLiveParams(null);
      });

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function setGestureState(isMatched) {
        gestureStateEl.textContent = isMatched ? "手勢1：辨識成功（5秒有效）" : "手勢1：未辨識";
        gestureStateEl.style.color = isMatched ? "#4ade80" : "#facc15";
      }

      function updateLiveParams(debug) {
        if (!debug) {
          liveExtendedEl.textContent = "0.000";
          liveCurledEl.textContent = "0.000";
          liveExtendedEl.classList.remove("pass");
          liveCurledEl.classList.remove("pass");
          return;
        }

        liveExtendedEl.textContent = debug.indexDelta.toFixed(3);
        liveCurledEl.textContent = debug.otherCurledValue.toFixed(3);
        liveExtendedEl.classList.toggle("pass", debug.indexExtended);
        liveCurledEl.classList.toggle("pass", debug.otherCurledPass);
      }

      function resizeCanvasToVideo() {
        if (!video.videoWidth || !video.videoHeight) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        // Keep the rendered stage ratio aligned with the real camera ratio
        // so touch/click coordinates don't drift on mobile (e.g. 3:4 streams).
        stageEl.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
      }

      function drawPoint(x, y, color = "#22d3ee") {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function drawLine(ax, ay, bx, by, color = "#a78bfa") {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineWidth = 2;
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      function isFingerExtended(hand, mcp, pip, tip, threshold) {
        const mcpY = hand[mcp].y;
        const pipY = hand[pip].y;
        const tipY = hand[tip].y;
        return (mcpY - tipY) > threshold && tipY < pipY && pipY < mcpY;
      }

      function isFingerCurled(hand, mcp, pip, tip, threshold) {
        const mcpY = hand[mcp].y;
        const pipY = hand[pip].y;
        const tipY = hand[tip].y;
        return tipY > (pipY + threshold) || pipY > (mcpY + threshold * 0.5);
      }

      function isThumbCurled(hand, threshold) {
        const thumbTip = hand[4];
        const thumbMcp = hand[2];
        const indexMcp = hand[5];
        const thumbToPalm = Math.abs(thumbTip.x - indexMcp.x);
        const mcpToIndexBase = Math.abs(thumbMcp.x - indexMcp.x) + 1e-6;
        return thumbToPalm < (mcpToIndexBase + threshold);
      }

      function getGestureOneDebug(hand, thresholdConfig) {
        const indexDelta = hand[5].y - hand[8].y;
        const middleDelta = hand[12].y - hand[9].y;
        const ringDelta = hand[16].y - hand[13].y;
        const pinkyDelta = hand[20].y - hand[17].y;

        const indexExtended = isFingerExtended(hand, 5, 6, 8, thresholdConfig.extendedThreshold);
        const middleCurled = isFingerCurled(hand, 9, 10, 12, thresholdConfig.curledThreshold);
        const ringCurled = isFingerCurled(hand, 13, 14, 16, thresholdConfig.curledThreshold);
        const pinkyCurled = isFingerCurled(hand, 17, 18, 20, thresholdConfig.curledThreshold);
        const thumbCurled = isThumbCurled(hand, thresholdConfig.curledThreshold);
        const otherCurledPass = middleCurled && ringCurled && pinkyCurled && thumbCurled;
        const otherCurledValue = Math.min(middleDelta, ringDelta, pinkyDelta);

        return {
          matched: indexExtended && otherCurledPass,
          indexExtended,
          middleCurled,
          ringCurled,
          pinkyCurled,
          thumbCurled,
          otherCurledPass,
          otherCurledValue,
          indexDelta,
          middleDelta,
          ringDelta,
          pinkyDelta,
        };
      }

      function getHandTheme(handLabel) {
        return HAND_COLOR_THEMES[handLabel] || HAND_COLOR_THEMES.Unknown;
      }

      function drawBoundingBox(hand, color) {
        const xs = hand.map((p) => (1 - p.x) * canvas.width);
        const ys = hand.map((p) => p.y * canvas.height);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);

        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(minX - 8, minY - 8, maxX - minX + 16, maxY - minY + 16);
        ctx.restore();
      }

      function drawIndexHighlight(hand) {
        for (let i = 0; i < INDEX_PATH.length - 1; i += 1) {
          const a = hand[INDEX_PATH[i]];
          const b = hand[INDEX_PATH[i + 1]];
          drawLine(
            (1 - a.x) * canvas.width,
            a.y * canvas.height,
            (1 - b.x) * canvas.width,
            b.y * canvas.height,
            "#ef4444"
          );
        }
        for (const idx of INDEX_POINTS) {
          const p = hand[idx];
          drawPoint((1 - p.x) * canvas.width, p.y * canvas.height, "#ef4444");
        }
      }

      function drawDebugPanel(debug) {
        const panelWidth = 360;
        const panelHeight = 210;

        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(12, 12, panelWidth, panelHeight);
        ctx.strokeStyle = "#60a5fa";
        ctx.lineWidth = 1;
        ctx.strokeRect(12, 12, panelWidth, panelHeight);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "16px Arial";
        ctx.fillText("Gesture Debug (One)", 24, 38);

        ctx.font = "14px Arial";
        ctx.fillText(`indexExtended: ${debug.indexExtended}`, 24, 64);
        ctx.fillText(`middleCurled: ${debug.middleCurled}`, 24, 86);
        ctx.fillText(`ringCurled: ${debug.ringCurled}`, 24, 108);
        ctx.fillText(`pinkyCurled: ${debug.pinkyCurled}`, 24, 130);
        ctx.fillText(`thumbCurled: ${debug.thumbCurled}`, 24, 152);
        ctx.fillText(`delta(index,middle): ${debug.indexDelta.toFixed(3)}, ${debug.middleDelta.toFixed(3)}`, 24, 174);
        ctx.fillText(`delta(ring,pinky): ${debug.ringDelta.toFixed(3)}, ${debug.pinkyDelta.toFixed(3)}`, 24, 196);
        ctx.restore();
      }

      function drawTopLeftOne() {
        ctx.save();
        ctx.font = "bold 96px Arial";
        ctx.fillStyle = "#facc15";
        ctx.textBaseline = "top";
        ctx.fillText("1", 20, 16);
        ctx.restore();
      }

      function drawCalibrationOverlay() {
        if (!calibrating) return;
        ctx.save();
        ctx.fillStyle = "rgba(15,23,42,0.35)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fde047";
        ctx.font = "18px Arial";
        ctx.fillText(`校正點 ${calibrationPoints.length}/4：請依序點 A4 四角`, 20, canvas.height - 20);
        calibrationPoints.forEach((p, idx) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(String(idx + 1), p.x + 10, p.y - 10);
        });
        ctx.restore();
      }

      function drawWallButton() {
        const center = wallToImagePoint(wallButton.cx, wallButton.cy);
        const edge = wallToImagePoint(wallButton.cx + wallButton.radiusCm, wallButton.cy);
        if (!center || !edge) return;
        const radiusPx = Math.hypot(edge.x - center.x, edge.y - center.y);
        ctx.save();
        ctx.beginPath();
        ctx.arc(center.x, center.y, radiusPx, 0, Math.PI * 2);
        ctx.fillStyle = interactionState === "pressed" ? "rgba(16,185,129,0.4)" : "rgba(59,130,246,0.35)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#e2e8f0";
        ctx.stroke();
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("PUSH", center.x, center.y);
        ctx.restore();

        if (autoDetectBag && detectedBagRect) {
          ctx.save();
          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 2;
          ctx.strokeRect(
            detectedBagRect.minX,
            detectedBagRect.minY,
            detectedBagRect.maxX - detectedBagRect.minX,
            detectedBagRect.maxY - detectedBagRect.minY
          );
          ctx.restore();
        }
      }

      function resetPressState() {
        interactionState = "idle";
        pressStartAt = 0;
        hoverBaselineZ = null;
        prevInsideButton = false;
        currentMetrics = { distanceCm: null, pressDepth: null, holdMs: 0 };
      }

      function updatePressDetection(now, tipPoint, tipZ) {
        const wallPoint = imageToWallPoint(tipPoint.x, tipPoint.y);
        if (!wallPoint) {
          resetPressState();
          return;
        }
        const distanceCm = Math.hypot(wallPoint.x - wallButton.cx, wallPoint.y - wallButton.cy);
        const insideButton = distanceCm <= (wallButton.radiusCm + pressConfig.hoverToleranceCm);
        if (insideButton && !prevInsideButton) {
          attempts += 1;
          hoverBaselineZ = tipZ;
        }
        prevInsideButton = insideButton;

        const pressDepth = hoverBaselineZ == null ? 0 : (tipZ - hoverBaselineZ);
        currentMetrics.distanceCm = distanceCm;
        currentMetrics.pressDepth = pressDepth;

        if (now - lastPressAt < pressConfig.debounceMs) {
          interactionState = "released";
          currentMetrics.holdMs = 0;
          return;
        }

        if (!insideButton) {
          interactionState = "idle";
          pressStartAt = 0;
          hoverBaselineZ = null;
          currentMetrics.holdMs = 0;
          return;
        }

        if (pressDepth > pressConfig.pressDepthThreshold) {
          if (!pressStartAt) pressStartAt = now;
          currentMetrics.holdMs = now - pressStartAt;
          interactionState = "pressing";
          if (currentMetrics.holdMs >= pressConfig.minHoldMs) {
            interactionState = "pressed";
            lastPressAt = now;
            successCount += 1;
            pushPressLog(`pressed dist=${distanceCm.toFixed(2)}cm depth=${pressDepth.toFixed(4)} hold=${Math.round(currentMetrics.holdMs)}ms`);
            pressStartAt = 0;
          }
          return;
        }

        currentMetrics.holdMs = 0;
        pressStartAt = 0;
        if (pressDepth < pressConfig.releaseDepthThreshold) {
          interactionState = "hover";
        } else {
          interactionState = "released";
        }
      }

      startCalibBtn.addEventListener("click", () => {
        autoDetectBag = false;
        calibrating = true;
        calibrationPoints = [];
        imageToWallH = null;
        wallToImageH = null;
        detectedBagRect = null;
        setCalibrationState("進行中（請點 4 個角點）");
      });

      resetCalibBtn.addEventListener("click", () => {
        calibrating = false;
        calibrationPoints = [];
        imageToWallH = null;
        wallToImageH = null;
        autoDetectBag = true;
        detectedBagRect = null;
        resetPressState();
        setCalibrationState("自動偵測牛皮紙袋中（按鈕置中）");
        updatePressHud();
      });

      function handleCalibrationPointer(ev) {
        if (!calibrating) return;
        ev.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const sx = canvas.width / rect.width;
        const sy = canvas.height / rect.height;
        calibrationPoints.push({
          x: (ev.clientX - rect.left) * sx,
          y: (ev.clientY - rect.top) * sy,
        });
        if (calibrationPoints.length < 4) {
          setCalibrationState(`進行中（已點 ${calibrationPoints.length}/4）`);
          return;
        }
        const wallPts = [
          { x: 0, y: 0 },
          { x: A4_WIDTH_CM, y: 0 },
          { x: A4_WIDTH_CM, y: A4_HEIGHT_CM },
          { x: 0, y: A4_HEIGHT_CM },
        ];
        imageToWallH = computeHomography(calibrationPoints, wallPts);
        wallToImageH = imageToWallH ? invert3x3(imageToWallH) : null;
        calibrating = false;
        calibrationPoints = [];
        if (imageToWallH && wallToImageH) {
          setCalibrationState("完成");
        } else {
          setCalibrationState("失敗（請重試）");
        }
      }

      canvas.addEventListener("pointerdown", handleCalibrationPointer);

      // MediaPipe Hands 的連線定義 (21 個點)
      const HAND_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
      ];

      async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user",
          },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        resizeCanvasToVideo();
      }

      async function createHandLandmarker() {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        return HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.5,
        });
      }

      async function main() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("此瀏覽器不支援 getUserMedia。");
          return;
        }

        try {
          updateLiveParams(null);
          setStatus("開啟攝影機中...");
          await initCamera();
          setStatus("載入手部模型中...");
          const handLandmarker = await createHandLandmarker();
          setStatus("追蹤中");

          let lastVideoTime = -1;

          function render() {
            const now = performance.now();
            resizeCanvasToVideo();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (video.currentTime !== lastVideoTime) {
              lastVideoTime = video.currentTime;
              const results = handLandmarker.detectForVideo(video, performance.now());
              const allHands = results.landmarks || [];
              const allHandedness = results.handednesses || [];
              detectFrameCount += 1;
              if (autoDetectBag && detectFrameCount % 4 === 0) {
                const found = detectBrownBagRect();
                if (found) {
                  detectedBagRect = found;
                  setCalibrationState("自動鎖定牛皮紙袋");
                } else if (!detectedBagRect) {
                  setCalibrationState("自動偵測中（請讓牛皮紙袋完整入鏡）");
                }
              }
              let hasOneGesture = false;
              let firstHandDebug = null;
              let chosenTip = null;

              for (let handIndex = 0; handIndex < allHands.length; handIndex += 1) {
                const hand = allHands[handIndex];
                const handedness = allHandedness[handIndex]?.[0]?.categoryName || "Unknown";
                const theme = getHandTheme(handedness);
                const debug = getGestureOneDebug(hand, params);
                if (!firstHandDebug) {
                  firstHandDebug = debug;
                }
                if (!chosenTip) {
                  chosenTip = {
                    x: (1 - hand[8].x) * canvas.width,
                    y: hand[8].y * canvas.height,
                    z: hand[8].z,
                  };
                }
                if (debug.matched) {
                  hasOneGesture = true;
                  lastOneMatchedAt = now;
                  activeHandIndex = handIndex;
                }

                drawBoundingBox(hand, theme.box);

                for (const [a, b] of HAND_CONNECTIONS) {
                  const p1 = hand[a];
                  const p2 = hand[b];
                  drawLine(
                    (1 - p1.x) * canvas.width,
                    p1.y * canvas.height,
                    (1 - p2.x) * canvas.width,
                    p2.y * canvas.height,
                    theme.line
                  );
                }

                for (const p of hand) {
                  drawPoint((1 - p.x) * canvas.width, p.y * canvas.height, theme.point);
                }

                const isActiveWindow = (now - lastOneMatchedAt) <= GESTURE_ACTIVE_MS;
                if (isActiveWindow && activeHandIndex === handIndex) {
                  drawIndexHighlight(hand);
                }
              }

              const isOneActive = hasOneGesture || ((now - lastOneMatchedAt) <= GESTURE_ACTIVE_MS);
              setGestureState(isOneActive);

              if (firstHandDebug) {
                updateLiveParams(firstHandDebug);
                drawDebugPanel(firstHandDebug);
              } else {
                updateLiveParams(null);
              }

              if (chosenTip) {
                updatePressDetection(now, chosenTip, chosenTip.z);
              } else {
                resetPressState();
              }

              // 最後才畫數字，避免被除錯面板蓋住
              if (isOneActive) {
                drawTopLeftOne();
              }

              drawWallButton();
              drawCalibrationOverlay();
              updatePressHud();
            }

            requestAnimationFrame(render);
          }

          render();
        } catch (err) {
          console.error(err);
          setStatus(
            "啟動失敗。請確認使用 localhost/https，並允許攝影機權限。"
          );
        }
      }

      main();
    </script>
  </body>
</html>
