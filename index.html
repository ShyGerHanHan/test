<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web 手部捕捉 Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        color: #d1d5db;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }

      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      video {
        transform: scaleX(-1);
      }

      canvas {
        pointer-events: none;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>前置鏡頭手部捕捉 (HTML Demo)</h1>
      <p>允許攝影機權限後，會在手部關鍵點上畫線與節點。</p>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="status" class="status">初始化中...</div>
    </div>

    <script type="module">
      import {
        HandLandmarker,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

      const video = document.getElementById("video");
      const canvas = document.getElementById("overlay");
      const statusEl = document.getElementById("status");
      const ctx = canvas.getContext("2d");

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function resizeCanvasToVideo() {
        if (!video.videoWidth || !video.videoHeight) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      function drawPoint(x, y, color = "#22d3ee") {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function drawLine(ax, ay, bx, by, color = "#a78bfa") {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineWidth = 2;
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      // MediaPipe Hands 的連線定義 (21 個點)
      const HAND_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
      ];

      async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user",
          },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        resizeCanvasToVideo();
      }

      async function createHandLandmarker() {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        return HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.5,
        });
      }

      async function main() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("此瀏覽器不支援 getUserMedia。");
          return;
        }

        try {
          setStatus("開啟攝影機中...");
          await initCamera();
          setStatus("載入手部模型中...");
          const handLandmarker = await createHandLandmarker();
          setStatus("追蹤中");

          let lastVideoTime = -1;

          function render() {
            resizeCanvasToVideo();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (video.currentTime !== lastVideoTime) {
              lastVideoTime = video.currentTime;
              const results = handLandmarker.detectForVideo(video, performance.now());
              const allHands = results.landmarks || [];

              for (const hand of allHands) {
                for (const [a, b] of HAND_CONNECTIONS) {
                  const p1 = hand[a];
                  const p2 = hand[b];
                  drawLine(
                    (1 - p1.x) * canvas.width,
                    p1.y * canvas.height,
                    (1 - p2.x) * canvas.width,
                    p2.y * canvas.height
                  );
                }

                for (const p of hand) {
                  drawPoint((1 - p.x) * canvas.width, p.y * canvas.height);
                }
              }
            }

            requestAnimationFrame(render);
          }

          render();
        } catch (err) {
          console.error(err);
          setStatus(
            "啟動失敗。請確認使用 localhost/https，並允許攝影機權限。"
          );
        }
      }

      main();
    </script>
  </body>
</html>
