<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web 手部捕捉 Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, "Microsoft JhengHei", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 12px;
        color: #d1d5db;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }

      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      video {
        transform: scaleX(-1);
      }

      canvas {
        pointer-events: none;
      }

      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #93c5fd;
      }

      .gesture-state {
        margin-top: 8px;
        font-size: 15px;
        color: #facc15;
      }

      .controls {
        display: flex;
        gap: 16px;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .controls label {
        font-size: 13px;
        color: #d1d5db;
      }

      .controls input {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>前置鏡頭手部捕捉 (HTML Demo)</h1>
      <p>允許攝影機權限後，會在手部關鍵點上畫線與節點。</p>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <label>
          食指伸直門檻
          <input id="extendedThreshold" type="range" min="0" max="0.12" step="0.005" value="0.04" />
          <span id="extendedThresholdValue">0.04</span>
        </label>
        <label>
          其他手指彎曲門檻
          <input id="curledThreshold" type="range" min="0" max="0.12" step="0.005" value="0.015" />
          <span id="curledThresholdValue">0.015</span>
        </label>
      </div>
      <div id="status" class="status">初始化中...</div>
      <div id="gestureState" class="gesture-state">手勢1：尚未偵測</div>
    </div>

    <script type="module">
      import {
        HandLandmarker,
        FilesetResolver,
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

      const video = document.getElementById("video");
      const canvas = document.getElementById("overlay");
      const statusEl = document.getElementById("status");
      const gestureStateEl = document.getElementById("gestureState");
      const extendedThresholdInput = document.getElementById("extendedThreshold");
      const curledThresholdInput = document.getElementById("curledThreshold");
      const extendedThresholdValue = document.getElementById("extendedThresholdValue");
      const curledThresholdValue = document.getElementById("curledThresholdValue");
      const ctx = canvas.getContext("2d");

      const params = {
        extendedThreshold: Number(extendedThresholdInput.value),
        curledThreshold: Number(curledThresholdInput.value),
      };

      extendedThresholdInput.addEventListener("input", () => {
        params.extendedThreshold = Number(extendedThresholdInput.value);
        extendedThresholdValue.textContent = params.extendedThreshold.toFixed(2);
      });

      curledThresholdInput.addEventListener("input", () => {
        params.curledThreshold = Number(curledThresholdInput.value);
        curledThresholdValue.textContent = params.curledThreshold.toFixed(2);
      });

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function setGestureState(isMatched) {
        gestureStateEl.textContent = isMatched ? "手勢1：辨識成功" : "手勢1：未辨識";
        gestureStateEl.style.color = isMatched ? "#4ade80" : "#facc15";
      }

      function resizeCanvasToVideo() {
        if (!video.videoWidth || !video.videoHeight) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      function drawPoint(x, y, color = "#22d3ee") {
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function drawLine(ax, ay, bx, by, color = "#a78bfa") {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineWidth = 2;
        ctx.strokeStyle = color;
        ctx.stroke();
      }

      function isFingerExtended(hand, mcp, pip, tip, threshold) {
        const mcpY = hand[mcp].y;
        const pipY = hand[pip].y;
        const tipY = hand[tip].y;
        return (mcpY - tipY) > threshold && tipY < pipY && pipY < mcpY;
      }

      function isFingerCurled(hand, mcp, pip, tip, threshold) {
        const mcpY = hand[mcp].y;
        const pipY = hand[pip].y;
        const tipY = hand[tip].y;
        return tipY > (pipY + threshold) || pipY > (mcpY + threshold * 0.5);
      }

      function isThumbCurled(hand, threshold) {
        const thumbTip = hand[4];
        const thumbMcp = hand[2];
        const indexMcp = hand[5];
        const thumbToPalm = Math.abs(thumbTip.x - indexMcp.x);
        const mcpToIndexBase = Math.abs(thumbMcp.x - indexMcp.x) + 1e-6;
        return thumbToPalm < (mcpToIndexBase + threshold);
      }

      function getGestureOneDebug(hand, thresholdConfig) {
        const indexDelta = hand[5].y - hand[8].y;
        const middleDelta = hand[12].y - hand[9].y;
        const ringDelta = hand[16].y - hand[13].y;
        const pinkyDelta = hand[20].y - hand[17].y;

        const indexExtended = isFingerExtended(hand, 5, 6, 8, thresholdConfig.extendedThreshold);
        const middleCurled = isFingerCurled(hand, 9, 10, 12, thresholdConfig.curledThreshold);
        const ringCurled = isFingerCurled(hand, 13, 14, 16, thresholdConfig.curledThreshold);
        const pinkyCurled = isFingerCurled(hand, 17, 18, 20, thresholdConfig.curledThreshold);
        const thumbCurled = isThumbCurled(hand, thresholdConfig.curledThreshold);

        return {
          matched: indexExtended && middleCurled && ringCurled && pinkyCurled && thumbCurled,
          indexExtended,
          middleCurled,
          ringCurled,
          pinkyCurled,
          thumbCurled,
          indexDelta,
          middleDelta,
          ringDelta,
          pinkyDelta,
        };
      }

      function drawBoundingBox(hand) {
        const xs = hand.map((p) => (1 - p.x) * canvas.width);
        const ys = hand.map((p) => p.y * canvas.height);
        const minX = Math.min(...xs);
        const maxX = Math.max(...xs);
        const minY = Math.min(...ys);
        const maxY = Math.max(...ys);

        ctx.save();
        ctx.strokeStyle = "#22c55e";
        ctx.lineWidth = 2;
        ctx.strokeRect(minX - 8, minY - 8, maxX - minX + 16, maxY - minY + 16);
        ctx.restore();
      }

      function drawDebugPanel(debug) {
        const panelWidth = 360;
        const panelHeight = 210;

        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(12, 12, panelWidth, panelHeight);
        ctx.strokeStyle = "#60a5fa";
        ctx.lineWidth = 1;
        ctx.strokeRect(12, 12, panelWidth, panelHeight);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "16px Arial";
        ctx.fillText("Gesture Debug (One)", 24, 38);

        ctx.font = "14px Arial";
        ctx.fillText(`indexExtended: ${debug.indexExtended}`, 24, 64);
        ctx.fillText(`middleCurled: ${debug.middleCurled}`, 24, 86);
        ctx.fillText(`ringCurled: ${debug.ringCurled}`, 24, 108);
        ctx.fillText(`pinkyCurled: ${debug.pinkyCurled}`, 24, 130);
        ctx.fillText(`thumbCurled: ${debug.thumbCurled}`, 24, 152);
        ctx.fillText(`delta(index,middle): ${debug.indexDelta.toFixed(3)}, ${debug.middleDelta.toFixed(3)}`, 24, 174);
        ctx.fillText(`delta(ring,pinky): ${debug.ringDelta.toFixed(3)}, ${debug.pinkyDelta.toFixed(3)}`, 24, 196);
        ctx.restore();
      }

      function drawTopLeftOne() {
        ctx.save();
        ctx.font = "bold 96px Arial";
        ctx.fillStyle = "#facc15";
        ctx.textBaseline = "top";
        ctx.fillText("1", 20, 16);
        ctx.restore();
      }

      // MediaPipe Hands 的連線定義 (21 個點)
      const HAND_CONNECTIONS = [
        [0, 1], [1, 2], [2, 3], [3, 4],
        [0, 5], [5, 6], [6, 7], [7, 8],
        [5, 9], [9, 10], [10, 11], [11, 12],
        [9, 13], [13, 14], [14, 15], [15, 16],
        [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
      ];

      async function initCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user",
          },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        resizeCanvasToVideo();
      }

      async function createHandLandmarker() {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        return HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.5,
        });
      }

      async function main() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("此瀏覽器不支援 getUserMedia。");
          return;
        }

        try {
          setStatus("開啟攝影機中...");
          await initCamera();
          setStatus("載入手部模型中...");
          const handLandmarker = await createHandLandmarker();
          setStatus("追蹤中");

          let lastVideoTime = -1;

          function render() {
            resizeCanvasToVideo();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (video.currentTime !== lastVideoTime) {
              lastVideoTime = video.currentTime;
              const results = handLandmarker.detectForVideo(video, performance.now());
              const allHands = results.landmarks || [];
              let hasOneGesture = false;
              let firstHandDebug = null;

              for (const hand of allHands) {
                const debug = getGestureOneDebug(hand, params);
                if (!firstHandDebug) {
                  firstHandDebug = debug;
                }
                if (debug.matched) {
                  hasOneGesture = true;
                }

                drawBoundingBox(hand);

                for (const [a, b] of HAND_CONNECTIONS) {
                  const p1 = hand[a];
                  const p2 = hand[b];
                  drawLine(
                    (1 - p1.x) * canvas.width,
                    p1.y * canvas.height,
                    (1 - p2.x) * canvas.width,
                    p2.y * canvas.height
                  );
                }

                for (const p of hand) {
                  drawPoint((1 - p.x) * canvas.width, p.y * canvas.height);
                }
              }

              if (hasOneGesture) {
                setGestureState(true);
              } else {
                setGestureState(false);
              }

              if (firstHandDebug) {
                drawDebugPanel(firstHandDebug);
              }

              // 最後才畫數字，避免被除錯面板蓋住
              if (hasOneGesture) {
                drawTopLeftOne();
              }
            }

            requestAnimationFrame(render);
          }

          render();
        } catch (err) {
          console.error(err);
          setStatus(
            "啟動失敗。請確認使用 localhost/https，並允許攝影機權限。"
          );
        }
      }

      main();
    </script>
  </body>
</html>
